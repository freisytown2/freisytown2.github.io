<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.12"/>
  <circle cx="256" cy="240" r="140" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.2"/>

  <!-- Open Book / Study emblem -->
  <g filter="url(#cardShadow)">
    <!-- Base pages (white/cream) -->
    <path d="M 256 360 C 210 330 140 330 96 345 L 96 215 C 140 200 210 200 256 230 C 302 200 372 200 416 215 L 416 345 C 372 330 302 330 256 360 Z" fill="#F8FAFC"/>
    
    <!-- Left page gradient shadow -->
    <path d="M 256 360 C 210 330 140 330 96 345 L 96 215 C 140 200 210 200 256 230 Z" fill="#EEF2F6"/>
    <path d="M 256 360 C 240 345 220 335 200 332 L 200 206 C 220 208 240 218 256 230 Z" fill="#E2E8F0" opacity="0.6"/>

    <!-- Right page subtle accent -->
    <path d="M 256 360 C 302 200 372 200 416 215 L 416 345 C 372 330 302 330 256 360 Z" fill="#FFFFFF"/>

    <!-- Book spine / center fold -->
    <path d="M 254 228 L 258 228 L 258 362 L 254 362 Z" fill="#CBD5E1"/>

    <!-- Educational Spark / Lightbulb / Brain star above book -->
    <!-- Cap / Birrete or Star -->
    <path d="M 256 120 L 340 162 L 256 204 L 172 162 Z" fill="url(#goldGrad)"/>
    <!-- Mortarboard cap underside -->
    <path d="M 214 183 L 214 220 C 214 236 298 236 298 220 L 298 183 Z" fill="#D97706"/>
    <!-- Tassel -->
    <path d="M 330 168 L 348 200 L 348 232" stroke="#FEF08A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="348" cy="235" r="5" fill="#FEF08A"/>
    <!-- Center button on cap -->
    <ellipse cx="256" cy="162" rx="8" ry="4" fill="#FEF08A"/>
  </g>

  <!-- Sparkles -->
  <path d="M 140 140 Q 140 160 120 160 Q 140 160 140 180 Q 140 160 160 160 Q 140 160 140 140 Z" fill="#38BDF8"/>
  <path d="M 372 120 Q 372 135 357 135 Q 372 135 372 150 Q 372 135 387 135 Q 372 135 372 120 Z" fill="#FCD34D"/>
  <circle cx="120" cy="280" r="6" fill="#34D399"/>
  <circle cx="390" cy="270" r="6" fill="#F472B6"/>
  <circle cx="256" cy="410" r="5" fill="#38BDF8"/>

  <!-- Subtitle banner text / letters -->
  <g fill="#FFFFFF" opacity="0.9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle">
    <text x="256" y="445" letter-spacing="4">ESTUDIO</text>
  </g>
</svg>
